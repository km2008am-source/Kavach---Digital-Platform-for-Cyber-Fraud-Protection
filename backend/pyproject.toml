[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kavach-backend"
version = "0.1.0"
description = "WhatsApp-first digital safety prototype backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "deep-translator>=1.11",
    "langdetect>=1.0.9",
    "reportlab>=4.2",
]

[tool.setuptools.packages.find]
include = ["kavach*"]
