[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kavach-backend"
version = "0.1.0"
description = "WhatsApp-first digital safety prototype backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "deep-translator>=1.11",
    "langdetect>=1.0.9",
    "reportlab>=4.2",
    # Person 2: analysis engine (kavach/analysis, kavach/llm.py)
    "pydantic-settings>=2.4",
    "tenacity>=8.5",
    "rapidfuzz>=3.9",
    "tldextract>=5.1",
    "python-whois>=0.9",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "androguard>=4.1",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "twilio>=9.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.100", "respx>=0.21", "ruff>=0.6"]
# Optional multilingual Pulse embeddings (PULSE_EMBEDDINGS=e5); large model download.
e5 = ["sentence-transformers>=3.0"]
voice = [
    "faster-whisper>=1.0",
    "gTTS>=2.5",
]

[tool.setuptools.packages.find]
include = ["kavach*"]
